<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Secure Patient Data</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Quantum Secure Patient Data</h2>

  <form id="patientForm">
    <label >Name:</label>
    <input placeholder="John" type="text" id="name" required>

    <label>Age:</label>
    <input type="number" id="age" min="0" required>

    <label >Diagnosis:</label>
    <input placeholder="Hypertension" type="text" id="diagnosis" required>

    <label >Prescription:</label>
    <textarea  placeholder="Amlodipine 5mg daily"
  id="prescription" rows="2" required></textarea>

    <button type="submit">Submit</button>
  </form>

  <pre id="output">Enter details and click "Submit"...</pre>

  <script src="script.js"></script>
</body>
</html>

<script>
function qkd_generate_key() {
  const array = new Uint8Array(32);
  window.crypto.getRandomValues(array);
  return Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function pqc_encrypt(data, key) {
  const encoder = new TextEncoder();
  const combined = JSON.stringify(data) + key;
  const digest = await crypto.subtle.digest("SHA-512", encoder.encode(combined));
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function tso_masking(data) {
  return {
    ...data,
    name: "MASKED",
    prescription: "MASKED"
  };
}

async function blockchain_generate_nonce(data) {
  const nonce = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER);
  const encoder = new TextEncoder();
  const input = JSON.stringify(data) + nonce;
  const digest = await crypto.subtle.digest("SHA-256", encoder.encode(input));
  const blockHash = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  return { nonce, blockHash };
}

function quantum_authenticate() {
  const array = new Uint8Array(16);
  window.crypto.getRandomValues(array);
  const token = Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
  const valid = token.length === 32;
  return { token, valid };
}
